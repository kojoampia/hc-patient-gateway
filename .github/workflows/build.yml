# Build, test and scan hc-patient-gateway.
#
# There was no CI in this repository at all before 2026-08-05, which is how a gateway that shipped a
# committed JWT signing key in its production profile stayed that way — the ArchUnit layer test, the
# JWT tests, BlockHound and the whole integration suite ran only when somebody remembered to run them
# locally.
#
# Scanning starts NON-BLOCKING (continue-on-error) on purpose. The dependency and secret scans will
# light up on day one — the committed keys are in git history and cannot be removed from it — and a
# job that is red on arrival is a job everybody learns to ignore. Triage the findings, then delete the
# continue-on-error lines so this actually gates. That second step is the point; without it this file
# is decoration.
name: Build and scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 25, matching <java.version> in the pom. Note the Enforcer range is [17,26), which EXCLUDES 26 —
      # the repo's CLAUDE.md claims java.version is 26, which would fail that rule outright; the pom is
      # the authority and it says 25. BlockHound instruments the reactive threads during the *IT suite,
      # so a build that passes on a different JDK is not evidence that this one does.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # The *IT suite starts MongoDB and Kafka through Testcontainers, so a working Docker daemon is
      # the only service dependency — `npm run services:up` is deliberately NOT needed here.
      - name: Build and test
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco-merged/
          retention-days: 7

  scan:
    name: Dependency and secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Secret scanning needs history, not just the tip: the point is to find what was committed
          # and later deleted, which is exactly the shape of this repo's JWT key.
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # Known-vulnerable Java dependencies. Spring Boot 4.0.6 and Spring Cloud 2025.1.1 are current,
      # but nothing was checking, and "current today" has a short shelf life.
      #
      # SKIPPED UNLESS AN NVD API KEY IS CONFIGURED. The first CI run showed why: NVD now rejects
      # anonymous downloads outright — "Invalid API Key, length of 0" — so without a key this step
      # cannot succeed, ever. A step that always fails teaches everyone to ignore the job it lives
      # in, which costs more than the check is worth.
      #
      # To turn it on: request a key at https://nvd.nist.gov/developers/request-an-api-key and add
      # it as the repository secret NVD_API_KEY. The step then runs, and once its findings are
      # triaged `continue-on-error` can come off too.
      - name: Dependency vulnerabilities
        if: env.NVD_API_KEY != ''
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >-
          ./mvnw --batch-mode --no-transfer-progress
          org.owasp:dependency-check-maven:check
          -DfailBuildOnCVSS=7
          -DassemblyAnalyzerEnabled=false
          -DnvdApiKey="$NVD_API_KEY"

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 7
          if-no-files-found: ignore

      # Credentials committed by mistake. .gitleaks.toml now allowlists the three known-dead keys —
      # the two burned production signing keys still in history, and the development key that is
      # committed on purpose — so a finding here should mean something new.
      #
      # BLOCKING as of the run on 6463ca4, which reported "no leaks found" with the allowlist loaded.
      # If this fails, extend .gitleaks.toml under the rule stated at the top of that file — do not
      # widen it to make the job green.
      #
      # Note what it actually scans: on a push the action examines the pushed commit range, not the
      # whole history. That is the right default for a gate, but it means the allowlist entries for
      # the burned keys only bite on a run that reaches back to them.
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
