# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

mongock:
  migration-scan-package:
    - net.jojoaddison.config.dbmigrations
  mongo-db:
    read-concern: local
    write-concern:
      journal: false
      w: 'majority'

spring:
  application:
    name: patientGateway
  autoconfigure:
    exclude:
      - org.springframework.cloud.gateway.config.GatewayMetricsAutoConfiguration
  cloud:
    # Mirrors the main config. src/test/resources/config/application.yml is the SAME classpath resource as the main
    # one and shadows it completely rather than merging — so anything configured only there is configured for
    # production and for nothing the tests can see. That has now caught three separate defects: a stream binding, a
    # key serializer, and this route.
    gateway:
      server:
        webflux:
          # Mirrored from the main application.yml, which this file REPLACES WHOLESALE. The value
          # equals the framework default, so MembershipStreamRouteIT would pass without it — which is
          # precisely why it is mirrored rather than left out: the two files must agree, or the next
          # person reads a difference as a decision. See the main file for what that test can and
          # cannot see.
          streaming-media-types:
            - text/event-stream
            - application/stream+json
          routes:
            # Mirrored from the main application.yml. The route itself is unreachable here — there is
            # no hcpatientservice to load-balance to and Consul is disabled — but its METADATA is what
            # the test reads, and metadata declared only in the main file is metadata no test can see.
            # Backlog item 39.
            - id: hcpatientservice-membership-stream
              uri: lb://hcpatientservice
              order: -1
              predicates:
                - Path=/services/hcpatientservice/api/membership-events
              filters:
                - StripPrefix=2
              metadata:
                # -1 is "no response timeout for this route". See the main file for why a stream that
                # inherits the gateway's default is cut with a 504 a client reads as a dead network.
                response-timeout: -1
            - id: abofonsa-plans
              uri: ${abofonsa.base-url:https://web.abofonsa.com}
              predicates:
                - Path=/api/plans
              filters:
                - SetPath=/api/v1/content/plans
                # Mirrored from the main application.yml, which this file REPLACES WHOLESALE rather
                # than merging with — the trap CLAUDE.md names, and which has already produced three
                # defects with a green suite, one of them on this very route. See the main file for
                # why a route leaving the estate must not relay the caller's token.
                - RemoveRequestHeader=Authorization
    consul:
      discovery:
        enabled: false
        instanceId: ${spring.application.name}:${spring.application.instance-id:${random.value}}
      config:
        enabled: false
      enabled: false
    function:
      # Mirrors the main file — this resource REPLACES it rather than merging with it, so a name
      # present only there is bound in production and in nothing any test can see, and vice versa.
      # The scaffold pair (`kafkaConsumer;kafkaProducer`) was deleted with the scaffold on
      # 2026-09-24 (backlog item 61). PatientEventFunctionDefinitionTest holds both copies.
      definition: patientEventsConsumer
    stream:
      kafka:
        binder:
          replicationFactor: 1
          auto-create-topics: true
        bindings:
          patientEvents-out-0:
            producer:
              # messageKeyExpression yields a String, and the binder's default key serializer is ByteArraySerializer —
              # which fails at send time with a ClassCastException, not at startup. In a service that swallows publish
              # failures by design that is silent: every event is lost and every test still passes.
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
              # One patient's events share a partition, and therefore an order.
              messageKeyExpression: headers['patientKey']
          entityEvents-out-0:
            producer:
              # Same trap as above, and the same fix: messageKeyExpression yields a String and the binder's default key
              # serializer is ByteArraySerializer, which fails at SEND time rather than at startup. Here it would be
              # doubly silent — EntityEventPublisher swallows send failures AND sends on a thread of its own.
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
              # One DOCUMENT's changes share a partition, and therefore an order — note this keys on the entity, not on
              # the patient as the binding above does.
              messageKeyExpression: headers['entityKey']
      bindings:
        # The patient journey. The patient service publishes onboarding and delegation onto the same topic; this
        # service contributes the two account events that happen before a patient record exists at all.
        patientEvents-out-0:
          destination: patient-events
          content-type: application/json
        # MIRRORED from src/main/resources/config/application.yml, and the mirroring is the point: this file REPLACES
        # that one on the test classpath rather than merging with it. A binding present only there is bound in
        # production and in nothing any test can see — and StreamBridge would invent a destination named after the
        # binding, so EntityEventBindingIT would pass against a topic that is not patient.event. The api's item 32
        # shipped an inert deployed consumer through exactly this gap.
        entityEvents-out-0:
          destination: patient.event
          content-type: application/json
        # Consumed back off the same topic to send the delegation emails. The group matters: without one every
        # instance would deliver its own copy, and a patient would be told their care angel stepped down once per
        # running gateway.
        patientEventsConsumer-in-0:
          destination: patient-events
          content-type: application/json
          group: patient-gateway
  # Jackson 3 removed SerializationFeature.WRITE_DURATIONS_AS_TIMESTAMPS; durations serialise as
  # ISO-8601 strings by default, so no spring.jackson.serialization override is needed here.
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
    # Mirrored from src/main/resources/config/application.yml. This file REPLACES that one on the
    # test classpath rather than merging with it, so anything set only there is set for production
    # and for nothing any test can see.
    encoding: UTF-8
  task:
    execution:
      thread-name-prefix: patient-gateway-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: patient-gateway-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  clientApp:
    name: 'patientGatewayApp'
  mail:
    from: patientGateway@localhost.com
    base-url: http://127.0.0.1:8080
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
        # DEVELOPMENT AND TEST ONLY. This value is committed, therefore public, therefore not a secret — it is
        # here so `./mvnw` works with no setup. It is deliberately the SAME string in hc-patient-service and
        # hc-patient-gateway: the gateway mints tokens and the service validates them, and until 2026-08-05 the two
        # repos shipped DIFFERENT committed keys, so a relayed token failed validation downstream in every
        # environment that did not override both.
        #
        # Production reads JWT_BASE64_SECRET from the environment (see application-prod.yml) and the application
        # refuses to start without it. Never copy this value anywhere that matters.
        base64-secret: G5oVDNDxRIh5PtBW0J+79wSUU4KuLJsDcXyo36DsTGIjSwVWjQBAXOXrCPDjf8RKqfghIRoBi2/H1IbqyAfasg==
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 86400

