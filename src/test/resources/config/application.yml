# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

mongock:
  migration-scan-package:
    - net.jojoaddison.config.dbmigrations
  mongo-db:
    read-concern: local
    write-concern:
      journal: false
      w: 'majority'

spring:
  application:
    name: patientGateway
  autoconfigure:
    exclude:
      - org.springframework.cloud.gateway.config.GatewayMetricsAutoConfiguration
  cloud:
    consul:
      discovery:
        enabled: false
        instanceId: ${spring.application.name}:${spring.application.instance-id:${random.value}}
      config:
        enabled: false
      enabled: false
    function:
      definition: kafkaConsumer;kafkaProducer
    stream:
      kafka:
        binder:
          replicationFactor: 1
          auto-create-topics: true
      bindings:
        binding-out-0:
          content-type: text/plain
          group: patient-gateway
        kafkaConsumer-in-0:
          destination: sse-topic
          content-type: text/plain
          group: patient-gateway
        kafkaProducer-out-0:
          content-type: text/plain
          group: patient-gateway
  # Jackson 3 removed SerializationFeature.WRITE_DURATIONS_AS_TIMESTAMPS; durations serialise as
  # ISO-8601 strings by default, so no spring.jackson.serialization override is needed here.
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  task:
    execution:
      thread-name-prefix: patient-gateway-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: patient-gateway-scheduling-
      pool:
        size: 20
  thymeleaf:
    mode: HTML

server:
  port: 10344
  address: localhost

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================
jhipster:
  clientApp:
    name: 'patientGatewayApp'
  mail:
    from: patientGateway@localhost.com
    base-url: http://127.0.0.1:8080
  logging:
    # To test json console appender
    use-json-format: false
    logstash:
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 (you can type `echo 'secret-key'|base64` on your command line)
        # DEVELOPMENT AND TEST ONLY. This value is committed, therefore public, therefore not a secret — it is
        # here so `./mvnw` works with no setup. It is deliberately the SAME string in hc-patient-service and
        # hc-patient-gateway: the gateway mints tokens and the service validates them, and until 2026-08-05 the two
        # repos shipped DIFFERENT committed keys, so a relayed token failed validation downstream in every
        # environment that did not override both.
        #
        # Production reads JWT_BASE64_SECRET from the environment (see application-prod.yml) and the application
        # refuses to start without it. Never copy this value anywhere that matters.
        base64-secret: G5oVDNDxRIh5PtBW0J+79wSUU4KuLJsDcXyo36DsTGIjSwVWjQBAXOXrCPDjf8RKqfghIRoBi2/H1IbqyAfasg==
        # Token is valid 24 hours
        token-validity-in-seconds: 86400
        token-validity-in-seconds-for-remember-me: 86400

