email.deletion.withdrawn.title=Votre dossier ne sera pas supprimé
email.deletion.withdrawn.greeting=Bonjour {0}
email.deletion.withdrawn.text1=Vous avez retiré votre demande de suppression de votre dossier médical. Rien n'a été effacé et votre dossier est inchangé.
email.deletion.completed.title=Votre dossier a été supprimé
email.deletion.completed.greeting=Bonjour {0}
email.deletion.completed.text1=Votre dossier médical et tout ce qu'il contenait ont été supprimés, comme vous l'avez demandé. Nous avons conservé uniquement la trace que la suppression a été demandée et effectuée ; elle ne contient aucune information clinique vous concernant.
email.deletion.completed.text2=Ceci est le dernier message que vous recevrez au sujet de votre dossier.
email.deletion.refused.title=Votre demande de suppression n'a pas été exécutée
email.deletion.refused.greeting=Bonjour {0}
email.deletion.refused.text1=Votre demande de suppression de votre dossier médical n'a pas été exécutée. Votre dossier est inchangé. Le motif figure sur la demande elle-même, dans votre profil.
