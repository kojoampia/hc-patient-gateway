# Care angel nomination and delegation
email.careangel.title=Vous avez été désigné ange gardien
email.careangel.greeting=Cher/Chère {0}
email.careangel.text1=Quelqu'un vous a demandé d'être son ange gardien sur Abofonsa BridgeCare.
email.careangel.text2=En acceptant, vous pourrez consulter et mettre à jour son dossier de santé, et agir en son nom si elle n'en est un jour plus capable. Rien ne se produit avant votre acceptation, et vous pouvez refuser ou vous retirer à tout moment.
email.careangel.text3=Cordialement,
email.delegation.ended.title=Votre ange gardien s'est retiré
email.delegation.ended.greeting=Cher/Chère {0}
email.delegation.ended.text1=Votre ange gardien s'est retiré ; personne ne peut donc actuellement agir en votre nom. Vous pouvez en désigner un autre depuis votre profil quand vous le souhaitez.
email.delegation.ended.text2=Cordialement,
email.delegation.revoked.title=Votre lien d'accompagnement a pris fin
email.delegation.revoked.greeting=Cher/Chère {0}
email.delegation.revoked.text1=Le lien d'accompagnement que vous déteniez a pris fin ; vous n'avez plus accès au dossier de santé de cette personne. Votre propre compte n'est pas affecté.
email.delegation.revoked.text2=Cordialement,
email.careangel.text4=Une fois connecté, la nomination vous attend dans Nominations d'accompagnement.

