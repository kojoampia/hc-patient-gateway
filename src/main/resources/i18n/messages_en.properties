# Care angel nomination and delegation
email.careangel.title=You have been named a care angel
email.careangel.greeting=Dear {0}
email.careangel.text1=Somebody has asked you to be their care angel on Abofonsa BridgeCare.
email.careangel.text2=Accepting means you will be able to see and update their health record, and act for them if they are ever unable to. Nothing happens until you accept, and you can decline or step down at any time.
email.careangel.text3=Regards,
email.delegation.ended.title=Your care angel has stepped down
email.delegation.ended.greeting=Dear {0}
email.delegation.ended.text1=Your care angel has stepped down, so nobody is currently able to act for you. You can nominate somebody else from your profile whenever you are ready.
email.delegation.ended.text2=Regards,
email.delegation.revoked.title=Your care connection has ended
email.delegation.revoked.greeting=Dear {0}
email.delegation.revoked.text1=The care connection you held has ended, and you no longer have access to that person's health record. Your own account is unaffected.
email.delegation.revoked.text2=Regards,
email.careangel.text4=Once you have signed in, the nomination is waiting under Care nominations.
