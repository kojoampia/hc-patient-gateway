# Care angel nomination and delegation
email.careangel.title=Sie wurden als Pflegeengel benannt
email.careangel.greeting=Liebe(r) {0}
email.careangel.text1=Jemand hat Sie gebeten, sein Pflegeengel bei Abofonsa BridgeCare zu sein.
email.careangel.text2=Mit der Annahme können Sie die Gesundheitsakte dieser Person einsehen und aktualisieren und für sie handeln, falls sie dazu einmal nicht in der Lage ist. Bis zur Annahme geschieht nichts, und Sie können jederzeit ablehnen oder zurücktreten.
email.careangel.text3=Mit freundlichen Grüßen,
email.delegation.ended.title=Ihr Pflegeengel ist zurückgetreten
email.delegation.ended.greeting=Liebe(r) {0}
email.delegation.ended.text1=Ihr Pflegeengel ist zurückgetreten, daher kann derzeit niemand für Sie handeln. Sie können jederzeit jemand anderen in Ihrem Profil benennen.
email.delegation.ended.text2=Mit freundlichen Grüßen,
email.delegation.revoked.title=Ihre Pflegeverbindung wurde beendet
email.delegation.revoked.greeting=Liebe(r) {0}
email.delegation.revoked.text1=Die von Ihnen gehaltene Pflegeverbindung wurde beendet; Sie haben keinen Zugriff mehr auf die Gesundheitsakte dieser Person. Ihr eigenes Konto ist davon nicht betroffen.
email.delegation.revoked.text2=Mit freundlichen Grüßen,
email.careangel.text4=Sobald Sie angemeldet sind, wartet die Nominierung unter Pflege-Nominierungen.

# --- Account deletion (2026-08-31) ------------------------------------------------------------
email.deletion.regards=Mit freundlichen Grüßen,
email.deletion.requested.title=Ihr Löschantrag ist bei uns eingegangen
email.deletion.requested.greeting=Guten Tag {0}
email.deletion.requested.text1=Ihr Antrag auf Löschung Ihrer Gesundheitsakte ist eingegangen. Er wird bis zum {0} ausgeführt, und zwar von einer dafür berechtigten Person und nicht durch einen einzelnen Tastendruck.
email.deletion.requested.text2=Sie können den Antrag jederzeit vorher in Ihrem Profil zurückziehen.
email.deletion.withdrawn.title=Ihre Akte wird nicht gelöscht
email.deletion.withdrawn.greeting=Guten Tag {0}
email.deletion.withdrawn.text1=Sie haben Ihren Antrag auf Löschung Ihrer Gesundheitsakte zurückgezogen. Es wurde nichts gelöscht und Ihre Akte ist unverändert.
email.deletion.completed.title=Ihre Akte wurde gelöscht
email.deletion.completed.greeting=Guten Tag {0}
email.deletion.completed.text1=Ihre Gesundheitsakte und alles darin wurde wie gewünscht gelöscht. Wir haben lediglich den Nachweis behalten, dass die Löschung beantragt und ausgeführt wurde; er enthält keine klinischen Angaben zu Ihnen.
email.deletion.completed.text2=Dies ist die letzte Nachricht, die Sie zu Ihrer Akte erhalten.
email.deletion.refused.title=Ihr Löschantrag wurde nicht ausgeführt
email.deletion.refused.greeting=Guten Tag {0}
email.deletion.refused.text1=Ihr Antrag auf Löschung Ihrer Gesundheitsakte wurde nicht ausgeführt. Ihre Akte ist unverändert. Die Begründung finden Sie am Antrag selbst, in Ihrem Profil.
