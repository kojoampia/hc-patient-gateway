# ===================================================================
# Spring Boot configuration for the "dev" profile.
#
# This configuration overrides the application.yml file.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

logging:
  level:
    ROOT: DEBUG
    tech.jhipster: DEBUG
    org.hibernate.SQL: DEBUG
    net.jojoaddison: DEBUG

management:
  zipkin: # Use the "zipkin" Maven profile to have the Spring Cloud Zipkin dependencies
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0 # report 100% of traces

spring:
  devtools:
    restart:
      enabled: true
      additional-exclude: static/**
    livereload:
      enabled: false # we use Webpack dev server + BrowserSync for livereload
  jackson:
    serialization:
      indent-output: true
  cloud:
    consul:
      config:
        fail-fast: false # if not in "prod" profile, do not force to use Spring Cloud Config
        format: yaml
        profile-separator: '-'
      discovery:
        prefer-ip-address: true
        tags:
          - profile=${spring.profiles.active}
          - version=#project.version#
          - git-version=${git.commit.id.describe:}
          - git-commit=${git.commit.id.abbrev:}
          - git-branch=${git.branch:}
      host: localhost
      port: 8500
  # Spring Boot 4 moved the Mongo properties from spring.data.mongodb.* to spring.mongodb.*;
  # the old prefix is deprecated at error level and is no longer bound.
  mongodb:
    uri: mongodb://localhost:27017/patientGateway?waitQueueMultiple=1000
  mail:
    host: localhost
    port: 25
    username:
    password:
  messages:
    cache-duration: PT1S # 1 second, see the ISO 8601 standard
  thymeleaf:
    cache: false

server:
  port: 5505

# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  gateway:
    rate-limiting:
      enabled: false
      limit: 100000
      duration-in-seconds: 3600
  # CORS is only enabled by default with the "dev" profile
  cors:
    # Allow Ionic for JHipster by default (* no longer allowed in Spring Boot 2.4+)
    allowed-origins: 'http://localhost:8100,https://localhost:8100,http://localhost:9000,https://localhost:9000'
    # Enable CORS when running in GitHub Codespaces
    allowed-origin-patterns: 'https://*.githubpreview.dev'
    allowed-methods: '*'
    allowed-headers: '*'
    exposed-headers: 'Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params'
    allow-credentials: true
    max-age: 1800
  security:
    authentication:
      jwt:
        # This token must be encoded using Base64 and be at least 256 bits long (you can type `openssl rand -base64 64` on your command line to generate a 512 bits one)
        # DEVELOPMENT AND TEST ONLY. This value is committed, therefore public, therefore not a secret — it is
        # here so `./mvnw` works with no setup. It is deliberately the SAME string in hc-patient-service and
        # hc-patient-gateway: the gateway mints tokens and the service validates them, and until 2026-08-05 the two
        # repos shipped DIFFERENT committed keys, so a relayed token failed validation downstream in every
        # environment that did not override both.
        #
        # Production reads JWT_BASE64_SECRET from the environment (see application-prod.yml) and the application
        # refuses to start without it. Never copy this value anywhere that matters.
        base64-secret: G5oVDNDxRIh5PtBW0J+79wSUU4KuLJsDcXyo36DsTGIjSwVWjQBAXOXrCPDjf8RKqfghIRoBi2/H1IbqyAfasg==
        # Shortened 2026-08-05. Was 24 hours / 30 days.
        #
        # Authentication here is stateless: no jti, no blocklist, no server-side session, and logout is a client-side
        # localStorage.removeItem. Nothing can revoke a token before it expires, so its lifetime IS the exposure
        # window for a stolen one — and the same signing key is shared with hc-admin and hc-professional, so that
        # window spans all three products. A month of it for health records was not a defensible number.
        #
        # 1 hour, and 7 days for "remember me". Real revocation (a jti claim plus a small blocklist collection both
        # decoders consult, or refresh tokens) is the actual fix and is tracked separately; this is the part that
        # costs nothing and shrinks the window by 97%.
        token-validity-in-seconds: 3600
        token-validity-in-seconds-for-remember-me: 604800
  mail: # specific JHipster mail property, for standard properties see MailProperties
    base-url: http://127.0.0.1:5505
  logging:
    use-json-format: false # By default, logs are not in Json format
    logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
      enabled: false
      host: localhost
      port: 5000
      ring-buffer-size: 512
