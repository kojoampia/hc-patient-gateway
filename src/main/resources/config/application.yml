jhipster:
  clientApp:
    name: 'patientGatewayApp'
  # By default CORS is disabled. Uncomment to enable.
  # cors:
  #   allowed-origins: "http://localhost:8100,http://localhost:9000"
  #   allowed-methods: "*"
  #   allowed-headers: "*"
  #   exposed-headers: "Authorization,Link,X-Total-Count,X-${jhipster.clientApp.name}-alert,X-${jhipster.clientApp.name}-error,X-${jhipster.clientApp.name}-params"
  #   allow-credentials: true
  #   max-age: 1800
  mail:
    from: patientGateway@localhost
  api-docs:
    default-include-pattern: /api/**
    management-include-pattern: /management/**
    title: PatientGateway API
    description: PatientGateway API documentation
    version: 0.0.1
    terms-of-service-url:
    contact-name:
    contact-url:
    contact-email:
    license: unlicensed
    license-url:
  security:
# ===================================================================
# Application specific properties
# Add your own application properties here, see the ApplicationProperties class
# to have type-safe configuration, like in the JHipsterProperties above
#
# More documentation is available at:
# https://www.jhipster.tech/common-application-properties/
# ===================================================================

# The first administrator on an empty database, created by AdminBootstrapInitializer in ANY profile.
#
# There is deliberately no password here and no default anywhere in the code: with one, every deployment of this image
# would accept the same credentials, which is exactly the defect this replaced. Set it per environment, as a secret:
#
#   GATEWAY_ADMIN_PASSWORD='<openssl rand -base64 24>'
#
# Left unset, no administrator is created. The account is only ever created, never updated, so rotating the password
# afterwards is done through the API (or by an operator) and survives restarts.
gateway:
  admin:
    login: admin
    email: admin@localhost
    password: ${GATEWAY_ADMIN_PASSWORD:}
# application:
