# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
reactive:
  feign:
    circuit:
      breaker:
        enabled: true
  # client:
  #   config:
  #     default:
  #       connectTimeout: 5000
  #       readTimeout: 5000
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - gateway
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    jhimetrics:
      enabled: true
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true

mongock:
  migration-scan-package:
    - net.jojoaddison.config.dbmigrations

spring:
  application:
    name: patientGateway
  cloud:
    consul:
      discovery:
        healthCheckPath: /management/health
        instanceId: patientgateway:${spring.application.instance-id:${random.value}}
        service-name: patientgateway
      config:
        watch:
          enabled: false
    gateway:
      # Spring Cloud Gateway 5 (Spring Cloud 2025.x) moved every server property under
      # `server.webflux`. Left at the old `spring.cloud.gateway.*` paths this whole block binds to
      # nothing: the discovery locator never produced a route, so GET /api/gateway/routes returned []
      # and every /services/<id>/** request 404'd for an authenticated caller, while unauthenticated
      # ones still got a 401 from the security filter and hid the problem.
      server:
        webflux:
          default-filters:
            - JWTRelay
          # BUFFERING OFF FOR THE MEMBERSHIP STREAM, and this is the property that decides it.
          # NettyWriteResponseFilter writes a response of one of these types with writeAndFlushWith,
          # one flush per chunk, instead of collecting it — so an SSE frame leaves this gateway when
          # the api produced it rather than when the response is finished, which for a stream is
          # never. These two ARE the framework default; they are written out because "the default
          # happens to be right" is not a decision anybody can find later, and because dropping
          # text/event-stream from this list would hold every patient's push until the connection
          # closed, with nothing failing.
          #
          # ⚠ WHAT THE TEST CAN AND CANNOT SEE. MembershipStreamRouteIT asserts the value
          # GatewayProperties actually resolved, which catches an ENVIRONMENT that overrides this
          # list — the ROUTES_* trap below, one property along. It does NOT catch a mistyped key
          # here, because the value declared equals the default and a key that binds to nothing
          # leaves the correct answer behind. Do not read that test as proof that this block is in
          # force; it is proof that text/event-stream is streamed.
          #
          # The other half of not buffering is nginx's, and the api sends `X-Accel-Buffering: no` for
          # it. This gateway passes response headers through untouched, which is what makes that
          # work end to end. See backlog item 39.
          streaming-media-types:
            - text/event-stream
            - application/stream+json
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true
              predicates:
                - name: Path
                  args:
                    pattern: "'/services/'+serviceId.toLowerCase()+'/**'"
              filters:
                - name: RewritePath
                  args:
                    regexp: "'/services/' + serviceId.toLowerCase() + '/(?<remaining>.*)'"
                    replacement: "'/${remaining}'"
          httpclient:
            pool:
              max-connections: 1000
          # A deliberate exception to discovery-based routing: Abofonsa is a different product on a different host,
          # not a service in this subsystem's Consul, so there is nothing to discover.
          #
          # It is proxied rather than called from the browser because the dashboard builds same-origin in production
          # (SERVER_API_URL empty, <base href="/">), no CORS is configured anywhere in this subsystem, and production
          # enforces a CSP. A direct call would need all three changed to fetch a price list.
          #
          # ⚠ THIS LIST IS REPLACED, NOT EXTENDED, BY ANY ENVIRONMENT THAT SETS
          # SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_*. Spring Boot does not merge a collection
          # across property sources: the highest-precedence source that contributes any element
          # supplies the whole list. Production and quality both set ROUTES_0 (hcpatientservice),
          # ROUTES_1 (professionalservice, for the patient day plan, since 2026-09-04) and ROUTES_2
          # (abofonsa-plans, since item 4 closed on 2026-09-06) — verified in the compose files
          # themselves on 2026-09-24 (`prod-server/compose.yml:209`, `quality/compose.yml:230`,
          # both `ROUTES_2_ID: abofonsa-plans`). This paragraph said "exactly two" until backlog
          # item 62; the block at the head of the routes list below names all three and was right.
          #
          # An earlier version of this note also cited a live measurement — one route in
          # `GET /api/gateway/routes`, `/api/plans` answering 404. That measurement predated
          # ROUTES_1 and ROUTES_2 and described the defect item 4 closed; it is deleted rather
          # than left dressed as evidence. What it was here to teach still holds and is the part
          # worth keeping: adding a route below adds it in DEVELOPMENT ONLY, and whoever adds the
          # next one must add a ROUTES_N to both compose files or ship a route that exists nowhere.
          #
          # NEVER DECLARE A CROSS-STACK ROUTE ON /api/**, here or in a compose file. It would
          # swallow this gateway's own /api/account, /api/authenticate and /api/users and proxy
          # authentication itself to another stack. GatewayRoutePolicyTest holds that line over this
          # file, with `abofonsa-plans` named as the one exception it is.
          #
          # A CROSS-STACK ROUTE ON THIS GATEWAY NAMES AN ENDPOINT, NOT A SERVICE. The second rule,
          # and the one that cost something: the professionalservice route shipped on 2026-09-04 as
          # `Path=/services/professionalservice/**` and was narrowed on 2026-09-05 to
          # `Path=/services/professionalservice/api/duty-roster/customer/**`.
          #
          # A whole-service prefix is safe on a gateway whose account holders are staff. It is not
          # safe here. `/services/**` is .authenticated() in SecurityConfiguration, hc-professional's
          # api gates /api/** the same way, and its ProfileResource.getAllProfiles carries no
          # @PreAuthorize and no caller scoping — so the wide predicate let any patient account read
          # the clinician staff directory, card numbers and home addresses included, and made
          # /api/profiles/email/{email} an existence oracle on a clinician's address. hc-admin's
          # gateway may carry a whole-service prefix precisely because its callers are
          # administrators; here the predicate does the work the caller population does not.
          #
          # Neither predicate is declared in this file — both live in deploy/prod-server/compose.yml
          # and quality/compose.yml, which replace this list entire. This note is where the rule is
          # written down; quality/startup.sh --verify is where it is executed, against a running
          # stack with a real patient token, because nothing in this repository can read a sibling
          # repository's compose file.
          routes:
            # THE ONE LONG-LIVED RESPONSE THIS GATEWAY CARRIES, and every default it meets is written
            # for a request that finishes. Backlog item 39: the patient service holds a
            # text/event-stream open for as long as the browser is on the screen, and the gateway
            # streams it rather than terminating it — terminating SSE here would mean this gateway
            # learning what a membership is and carrying a second copy of the who-may-see-it rule
            # that PatientScope already owns, which was considered and declined.
            #
            # It is declared ahead of the broad /services/hcpatientservice/** route on purpose and
            # with an explicit order, because it exists ONLY to say something that route does not.
            # Route order among property-declared and discovery-located routes is otherwise
            # unspecified, and losing the race here does not fail: the stream is simply cut at the
            # response timeout, which reads as a flaky connection rather than as a route problem.
            #
            # ⛔ THIS ROUTE IS NOT IN ANY DEPLOYED ENVIRONMENT YET, and the block above says why: both
            # compose files set SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_* and replace this list
            # entire. They currently declare ROUTES_0 (hcpatientservice), ROUTES_1
            # (professionalservice) and ROUTES_2 (abofonsa-plans), so this needs a ROUTES_3 with the
            # same predicate, StripPrefix=2, and — the part that is easy to drop when translating a
            # nested metadata map into flat variables —
            # SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_ROUTES_3_METADATA_RESPONSE_TIMEOUT: "-1".
            # Without it the stream works in development and is cut in the one place it matters.
            # Those files are in hc-patient/deploy and hc-patient/quality, which nothing here can
            # edit; backlog item 39 cycle 1 delivers the server halves only.
            - id: hcpatientservice-membership-stream
              uri: lb://hcpatientservice
              order: -1
              predicates:
                # An ENDPOINT, not a service — the rule stated below for cross-stack routes, applied
                # here too because a narrow predicate costs nothing and a wide one is how the
                # professionalservice route exposed a staff directory.
                - Path=/services/hcpatientservice/api/membership-events
              filters:
                # Matches the deployed hcpatientservice route's shape: /services/<id>/api/... -> /api/...
                - StripPrefix=2
              metadata:
                # ⚠ THE WHOLE REASON THIS ROUTE EXISTS. -1 disables the response timeout for this
                # route alone; NettyRoutingFilter reads `response-timeout` out of the route metadata
                # and treats a negative value as "none". Without it the gateway applies
                # spring.cloud.gateway.server.webflux.httpclient.response-timeout, and an environment
                # that sets one — a compose file, a Consul KV entry — would cut every patient's
                # stream at that interval with a 504 the client cannot distinguish from a dead
                # network. Nothing sets one today, which is exactly why this is easy to omit and
                # invisible when it is.
                response-timeout: -1
            - id: abofonsa-plans
              uri: ${abofonsa.base-url:https://web.abofonsa.com}
              predicates:
                - Path=/api/plans
              filters:
                # Abofonsa's own path. Rewritten here so the dashboard never has to know another product's URL shape.
                - SetPath=/api/v1/content/plans
                # REQUIRED, AND ITS ABSENCE MADE THIS ROUTE UNUSABLE (backlog item 4, 2026-09-06).
                #
                # `JWTRelay` is a DEFAULT filter — declared under default-filters above, so it applies to every route
                # in this file, including this one. It re-sets the caller's bearer token on the outgoing request,
                # which is exactly right for the two routes that stay inside the estate and exactly wrong here: this
                # is the only route that LEAVES it. Abofonsa cannot validate an hc-patient token and answers 401 to
                # any Authorization header it does not recognise — measured, 2026-09-06: the same URL returns 200
                # with no header and 401 with a bearer token.
                #
                # So the route would have 401'd even if it had been in a deployed route table, and the entry that
                # opened item 4 assumed it was merely mis-deployed. It was both. Route filters run after the default
                # ones, so this removes what JWTRelay just added.
                #
                # It also means the patient's token is not sent to another product, which is the right posture
                # independently of whether Abofonsa would have accepted it.
                - RemoveRequestHeader=Authorization
    function:
      # `patientEventsConsumer` is PatientEventMailRouter's binding and it sends real mail — the
      # care-delegation and erasure notices. Dropping it from this list does not fail anything:
      # the context starts, the gateway serves, and every one of those mails silently stops.
      # PatientEventFunctionDefinitionTest holds this line (and the test file's copy of it) to the
      # name; PatientEventConsumerBindingIT proves the bean behind the name still exists.
      #
      # `kafkaConsumer` and `kafkaProducer` were here until 2026-09-24 and were the JHipster
      # scaffold, deleted with it (backlog item 61) — the api shed its copy on 2026-09-18.
      # `kafkaProducer` was a Supplier<String> returning the literal "kakfa_producer", which Spring
      # Cloud Stream polls once a second, so this gateway published that string to a topic nothing
      # consumed for as long as it ran.
      definition: patientEventsConsumer
    stream:
      kafka:
        binder:
          replicationFactor: 1
          auto-create-topics: true
          # THIS IS THE PROPERTY THAT GOVERNS SENDS, and it is the one to set in a compose file.
          #
          # backlog item 7. Everything in this subsystem publishes through `StreamBridge`
          # (`PatientEventPublisher`; the generated `*KafkaResource` did too, until item 61 deleted
          # the scaffold), and StreamBridge goes through the BINDER — so
          # `spring.cloud.stream.kafka.binder.brokers`, overridden as
          # SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS, is what decides where an event actually lands.
          # `SPRING_KAFKA_BOOTSTRAP_SERVERS` configures Spring Boot`s own KafkaTemplate/KafkaAdmin,
          # which NOTHING HERE USES. The quality stack sets both and production sets only this one;
          # production is not broken by that, and this note exists so the next person copying a
          # compose file copies the half that matters rather than the other one.
          #
          # DO NOT "FIX" THE DEFAULT BELOW. localhost:9092 is correct for `./mvnw` on a developer
          # machine, which is the one case with no compose file to override it. The defect item 7
          # records is the ABSENCE OF A CHECK, not the value: with no override the service starts,
          # serves, reports healthy, and discards every event it produces. `deploy.sh` asserts the
          # resolved broker since 2026-09-06, and `quality/startup.sh --verify` since 2026-09-05.
          brokers: localhost:9092
        bindings:
          patientEvents-out-0:
            producer:
              # messageKeyExpression yields a String, and the binder's default key serializer is ByteArraySerializer —
              # which fails at send time with a ClassCastException, not at startup. In a service that swallows publish
              # failures by design that is silent: every event is lost and every test still passes.
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
              # One patient's events share a partition, and therefore an order.
              messageKeyExpression: headers['patientKey']
          entityEvents-out-0:
            producer:
              # Same trap as above, and the same fix: messageKeyExpression yields a String and the binder's default key
              # serializer is ByteArraySerializer, which fails at SEND time rather than at startup. Here it would be
              # doubly silent — EntityEventPublisher swallows send failures AND sends on a thread of its own.
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
              # One DOCUMENT's changes share a partition, and therefore an order — note this keys on the entity, not on
              # the patient as the binding above does. A create and a delete of one document arriving out of order is an
              # audit trail saying the document still exists.
              messageKeyExpression: headers['entityKey']
      bindings:
        # The patient journey. The patient service publishes onboarding and delegation onto the same topic; this
        # service contributes the two account events that happen before a patient record exists at all.
        patientEvents-out-0:
          destination: patient-events
          content-type: application/json
        # The entity-change stream (docs/backlog.md item 45). Every audit-worthy document this gateway writes, for
        # hc-admin's audit trail — including the deactivation that completes an erasure, which reaches no other topic.
        # The api publishes its half onto this same topic. This is an ADD: patient-events below is untouched, and
        # retiring it is item 46.
        entityEvents-out-0:
          destination: patient.event
          content-type: application/json
        # Consumed back off the same topic to send the delegation emails. The group matters: without one every
        # instance would deliver its own copy, and a patient would be told their care angel stepped down once per
        # running gateway.
        patientEventsConsumer-in-0:
          destination: patient-events
          content-type: application/json
          group: patient-gateway
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: #spring.profiles.active#
    group:
      dev:
        - dev
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: false
  messages:
    basename: i18n/messages
    # Belt and braces, NOT the fix for anything broken today: MessageSourceProperties already
    # initialises `encoding` to StandardCharsets.UTF_8, so this line changes no observed behaviour.
    # It is here so the catalogues stop depending on a framework default nobody declared, and so a
    # Boot upgrade that changed that default would not silently re-decode 46 accented values.
    # What actually holds the catalogues correct is MessageCatalogueEncodingUnitTest, which asserts
    # the bytes on disk round-trip through this setting — a property set to the right value cannot
    # protect a file that was already double-encoded when it was written.
    encoding: UTF-8
  main:
    allow-bean-definition-overriding: true
  webflux:
    problemdetails:
      enabled: true
  task:
    execution:
      thread-name-prefix: patient-gateway-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: patient-gateway-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

